name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Gradle Wrapper
        id: wrapper
        continue-on-error: true
        run: |
          set -o pipefail
          gradle wrapper --gradle-version 8.9 2>&1 | tee /tmp/wrapper.log

      - name: Build Debug APK
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log

      - name: Publish build logs to debug-log branch (always)
        if: always()
        run: |
          set -e
          mkdir -p /tmp/debug
          cp /tmp/wrapper.log /tmp/debug/wrapper.log 2>/dev/null || echo "no wrapper log" > /tmp/debug/wrapper.log
          cp /tmp/build.log   /tmp/debug/build.log   2>/dev/null || echo "no build log"   > /tmp/debug/build.log
          {
            echo "Build attempt: $(date -u +'%Y-%m-%d %H:%M:%SZ')"
            echo "Commit: ${GITHUB_SHA}"
            echo "Wrapper outcome: ${{ steps.wrapper.outcome }}"
            echo "Build outcome:   ${{ steps.build.outcome }}"
            echo "Run id: ${GITHUB_RUN_ID}"
          } > /tmp/debug/SUMMARY.txt
          cd /tmp/debug
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b debug-log
          git add .
          git commit -q -m "Build log $(date -u +'%Y-%m-%d %H:%M:%SZ')"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" debug-log:debug-log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK as workflow artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: SalesGoalsApp-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publish APK to apk-output branch
        if: steps.build.outcome == 'success'
        run: |
          set -e
          mkdir -p /tmp/out
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/out/app-debug.apk
          cd /tmp/out
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b apk-output
          echo "APK generado el $(date -u +'%Y-%m-%d %H:%M:%S UTC')" > BUILD_INFO.txt
          git add .
          git commit -q -m "APK build $(date -u +'%Y-%m-%d %H:%M:%SZ')"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" apk-output:apk-output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail job if build failed
        if: steps.build.outcome != 'success'
        run: exit 1
